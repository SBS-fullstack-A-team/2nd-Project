<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="힌트 퀴즈">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2f8f"/>
      <stop offset="1" stop-color="#6c3fc4"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>

  <!-- 큰 물음표 -->
  <circle cx="250" cy="90" r="56" fill="#ffe36e"/>
  <text x="250" y="118" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="84" font-weight="900" fill="#3b2f8f">?</text>

  <!-- 힌트 카드: 열린 힌트 2개 + 잠긴 힌트 3개 -->
  <g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="13" font-weight="700">
    <rect x="22" y="22" width="160" height="24" rx="6" fill="#ffffff"/>
    <circle cx="36" cy="34" r="8" fill="#e8386d"/>
    <text x="36" y="38.5" text-anchor="middle" fill="#fff" font-size="11">1</text>
    <text x="52" y="38.5" fill="#2d2a4a">포지션 · 공격수</text>

    <rect x="22" y="52" width="160" height="24" rx="6" fill="#ffffff"/>
    <circle cx="36" cy="64" r="8" fill="#e8386d"/>
    <text x="36" y="68.5" text-anchor="middle" fill="#fff" font-size="11">2</text>
    <text x="52" y="68.5" fill="#2d2a4a">국적 · 대한민국</text>

    <g fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-dasharray="4 3">
      <rect x="22" y="82" width="160" height="24" rx="6"/>
      <rect x="22" y="112" width="160" height="24" rx="6"/>
      <rect x="22" y="142" width="160" height="24" rx="6"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.7">
      <text x="36" y="98.5" text-anchor="middle" font-size="11">3</text>
      <text x="52" y="98.5">🔒 힌트 3</text>
      <text x="36" y="128.5" text-anchor="middle" font-size="11">4</text>
      <text x="52" y="128.5">🔒 힌트 4</text>
      <text x="36" y="158.5" text-anchor="middle" font-size="11">5</text>
      <text x="52" y="158.5">🔒 힌트 5</text>
    </g>
  </g>
</svg>
