# 자동 배포 — main 에 머지되면 API(Workers)와 DB(D1)를 배포한다.
# 웹(Pages)은 Cloudflare Git 연동으로 따로 자동 배포되므로 여기서 다루지 않는다.
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions)
#   CLOUDFLARE_API_TOKEN  — 권한: Account / D1: Edit, Account / Workers Scripts: Edit
#   CLOUDFLARE_ACCOUNT_ID — 팀 Cloudflare 계정 ID
name: Deploy

on:
  push:
    branches: [main]
    # API·DB 에 영향을 주는 변경이 있을 때만 실행한다 (웹만 바뀌면 Pages 가 처리)
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'
  # Actions 탭에서 수동 실행도 가능 (재배포가 필요할 때)
  workflow_dispatch:

# 배포는 겹치지 않게 하나씩, 진행 중인 배포는 취소하지 않는다
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # main 은 CI 를 통과한 PR 만 머지되지만, 운영 반영 직전에 한 번 더 확인한다
      - name: 타입 체크
        run: pnpm typecheck

      # 1) 스키마 — 아직 적용되지 않은 마이그레이션만 적용된다
      - name: 원격 D1 마이그레이션
        run: pnpm exec wrangler d1 migrations apply simsim-arcade-db --remote

      # 2) 시드 — seeds/*.sql 을 파일명 순서대로 전부 적용 (여러 번 실행해도 안전하게 작성된 파일들)
      - name: 원격 D1 시드
        run: |
          for file in seeds/*.sql; do
            echo "▶ 시드 적용: $file"
            pnpm exec wrangler d1 execute simsim-arcade-db --remote --file="$file"
          done

      # 3) API — 새 게임의 game 행이 들어간 뒤에 배포한다
      - name: Workers 배포
        run: pnpm exec wrangler deploy

      - name: 배포 확인 (health check)
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://simsim-arcade-api.sbstacarematch1.workers.dev/api/health; then
              exit 0
            fi
            sleep 5
          done
          echo "health check 실패" && exit 1
